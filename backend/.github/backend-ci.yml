
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test Java API
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Allow Maven Wrapper to run
        run: chmod +x mvnw

      - name: Run automated tests
        run: ./mvnw --batch-mode --no-transfer-progress test
